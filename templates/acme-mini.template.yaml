# Acme Mini: the demo world (PLAN 8.3, 8.4, 8.6). A small company's rooms and agents, with Clearance
# added as a member of every room. No change to Switch or to its bundled templates.
#
# An agent's owner is whoever runs the template that creates it, and it can only run on a machine of
# that owner. So where Priya and Alex each enrol a machine, this runs three times:
#
#   as Priya:  create_support_agents=true   create_eng_agents=false  create_rooms=false
#   as Alex:   create_support_agents=false  create_eng_agents=true   create_rooms=false
#   as anyone: create_support_agents=false  create_eng_agents=false  create_rooms=true
#
# With one machine, run it once with the defaults; every agent is then owned by whoever ran it.
#
# Addressing: every agent says `anyone`. Clearance has its own owner, and an agent on the default
# `owner-agents` answers `not_permitted` when Clearance tells it a request was approved (spike S4).
version: 2

params:
  create_support_agents:
    type: boolean
    label: Create refunds-agent and support-agent
    default: true
  create_eng_agents:
    type: boolean
    label: Create coder, ops-agent and reviewer
    default: true
  create_rooms:
    type: boolean
    label: Create the rooms
    description: Every agent they list must exist by then.
    default: true
  machine:
    type: machine
    description: The machine the agents run on, one of yours. The first ready one is chosen.
    default: [$first]
    # Not required of a run that only creates rooms, which may be by someone with no machine.
    required: false
    input: advanced
  agents_root:
    type: directory
    label: Agents' folder
    description: Each agent works in a folder of its own under this, a clone of acme-mini-app.
    default: "{$agents_dir}"
    input: advanced
  repo_url:
    type: string
    label: acme-mini-app repository
    description: Left empty, the folders must already hold a clone, with the enforcement config in it.
    required: false
    input: advanced
  bridge:
    type: bridge
    description: The messaging app the rooms live on. The server's default app is chosen.
    default: [$first]
    required: false
    input: advanced
  clearance_rules:
    type: string
    label: Clearance rules every agent is given (PLAN 8.5)
    multiline: true
    input: fixed
    default: |
      Clearance rules (this team uses Clearance for approvals):
      1. Some actions are held for a human. If a command or tool answers with HELD or PENDING and an id like CLR-0042,
         stop that action and tell the person in this thread, in one line, that it is waiting for approval and give the id.
      2. Never try a held action another way: no other tool, no direct API call, no smaller pieces, no edits to config files.
      3. When @clearance says CLR-0042 was approved and executed, report the result. When it says approved, retry,
         run the exact same command once. When it says denied, tell the person the reason and stop.
      4. Before any money, deploy, merge, delete or customer email, say in the thread exactly what you are about to do,
         with the amount or target. Clearance compares what you say with what you run.

resources:
  # ── Agents ────────────────────────────────────────────────────────────────
  refunds_agent:
    type: agent
    if: "{create_support_agents}"
    name: refunds-agent
    display_name: Refunds agent
    description: Handles refund requests for customer tickets.
    provider: claude
    machine: "{machine}"
    directory: "{agents_root}/refunds-agent"
    repo:
      - { if: "{repo_url}", value: "{repo_url}" }
    auto_mode: true
    can_manage_agents: false
    addressing: anyone
    instructions: |
      You handle customer refunds for Acme. Tickets and orders are reachable through the `acme` CLI in
      this repository: read the ticket, check the order and the customer, and refund what the ticket
      supports. Work in the thread you were asked in.

      {clearance_rules}
  support_agent:
    type: agent
    if: "{create_support_agents}"
    name: support-agent
    display_name: Support agent
    description: Writes to customers about their orders.
    provider: codex
    machine: "{machine}"
    directory: "{agents_root}/support-agent"
    repo:
      - { if: "{repo_url}", value: "{repo_url}" }
    auto_mode: true
    can_manage_agents: false
    addressing: anyone
    instructions: |
      You answer customers for Acme. Look up tickets, orders and customers through the `acme` CLI in
      this repository, and send customer email with it when a person asks you to.

      {clearance_rules}
  coder_agent:
    type: agent
    if: "{create_eng_agents}"
    name: coder
    display_name: Coder
    description: Changes the checkout service and opens pull requests.
    provider: claude
    machine: "{machine}"
    directory: "{agents_root}/coder"
    repo:
      - { if: "{repo_url}", value: "{repo_url}" }
    auto_mode: true
    can_manage_agents: false
    addressing: anyone
    instructions: |
      You work on Acme's checkout service in this repository. Change code, run its tests, and push
      branches when a person asks. Work in the thread you were asked in.

      {clearance_rules}
  ops_agent:
    type: agent
    if: "{create_eng_agents}"
    name: ops-agent
    display_name: Ops agent
    description: Deploys and rolls back Acme's services.
    provider: opencode
    machine: "{machine}"
    directory: "{agents_root}/ops-agent"
    repo:
      - { if: "{repo_url}", value: "{repo_url}" }
    auto_mode: true
    can_manage_agents: false
    addressing: anyone
    instructions: |
      You run deploys and rollbacks for Acme's services through the `acme` CLI in this repository.
      Check the version's CI status before you deploy it, and say what you find.

      {clearance_rules}
  reviewer_agent:
    type: agent
    if: "{create_eng_agents}"
    name: reviewer
    display_name: Reviewer
    description: Reviews pull requests on the checkout service.
    provider: cursor
    machine: "{machine}"
    directory: "{agents_root}/reviewer"
    repo:
      - { if: "{repo_url}", value: "{repo_url}" }
    auto_mode: true
    can_manage_agents: false
    addressing: anyone
    instructions: |
      You review pull requests on Acme's checkout service in this repository. Read the change and its
      checks, say what you find, and merge when a person asks you to.

      {clearance_rules}

  # ── Rooms ─────────────────────────────────────────────────────────────────
  # Agents are listed by name, not by key: a room may be created in a later run than its agents. So no
  # agent's key may equal its name, or a run that does not create that agent refuses to name it.
  acme:
    type: group
    if: "{create_rooms}"
    name: Acme Mini
    description: A small company's rooms, with Clearance in each.
    links:
      - { from: support, to: approvals, label: Requests from support wait here }
      - { from: eng, to: approvals, label: Requests from engineering wait here }
      - { from: finance, to: approvals, label: Finance answers requests here }
  support:
    type: room
    if: "{create_rooms}"
    group: acme
    name: support
    description: Customer requests, refunds and customer email.
    bridge: "{bridge}"
    agents: [refunds-agent, support-agent, clearance]
    users: [priya, sam]
    instructions: |
      Customer requests arrive here. refunds-agent handles refunds, support-agent writes to customers.
      Clearance is here to hold what the policy protects; it reads this room and says little.
  finance:
    type: room
    if: "{create_rooms}"
    group: acme
    name: finance
    description: Finance chatter, and the second step when a refund is waiting.
    bridge: "{bridge}"
    agents: [clearance]
    users: [sam, neha]
    instructions: Finance's own room. Clearance escalates a waiting refund here when no approver has answered.
  eng:
    type: room
    if: "{create_rooms}"
    group: acme
    name: eng
    description: Code, merges and deploys.
    bridge: "{bridge}"
    agents: [coder, ops-agent, reviewer, clearance]
    users: [alex, priya]
    instructions: |
      Engineering work happens here. coder changes code, reviewer reviews it, ops-agent deploys it.
      Clearance is here to hold what the policy protects; it reads this room and says little.
  approvals:
    type: room
    if: "{create_rooms}"
    group: acme
    name: approvals
    description: Requests waiting on a person, drill notices, and Clearance's ledger.
    bridge: "{bridge}"
    agents: [clearance]
    users: [sam, neha, alex, priya]
    instructions: |
      Clearance owns this room. It posts approval cards for requests no direct message reached, and
      mirrors its ledger here as one room document per day.
    docs:
      - name: how-clearance-works
        description: What Clearance holds, who it asks, and what a drill is.
        instructions: Read this before answering a card for the first time.
        content: |
          # How Clearance works here

          Agents act freely until they reach something the policy protects: money out, a deploy, a
          merge to main, a customer email, a delete. Clearance holds that action and asks a person.

          Press a button on the card, or reply with its handle: `A12 yes`, `A12 no`. The card shows
          its own handle, and a handle only means something in the room the card is in.

          Someone the policy names, who did not ask and does not own the agent, gets asked.
          `@clearance why CLR-0042` shows the reasoning for any request.

          Now and then a card is practice: a request with a planted flaw, where nothing runs whatever
          you answer. You are told afterwards.
