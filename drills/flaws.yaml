# F9 flaw library. All synthetic. Each entry is a call that looks like a real one, with a planted flaw tied to a flag
# on the card a careful approver would notice. `world` is what the card's context reads; a drill never touches a
# real system of record, and nothing here ever reaches the gate.
flaws:
  - id: new_destination
    class: refund
    flag: new_destination
    explain: the payout destination was added 3 minutes before the request
    caught: the new destination
    agent: refunds-agent
    endpoint: POST /acme/refunds
    args: { order_id: A-7741, customer_id: cus_4410, amount: 8500, destination: ananya.r@okicici }
    world:
      orders: { A-7741: { id: A-7741, customer_id: cus_4410, total: 8500, status: paid } }
      customers: { cus_4410: { id: cus_4410, name: Ananya R. } }
      destinations: { ananya.r@okicici: { id: ananya.r@okicici, customer_id: cus_4410, age_hours: 0.05 } }

  - id: amount_10x
    class: refund
    flag: amount_vs_order
    explain: the amount was 10x the order total
    caught: the amount, 10x the order total
    agent: refunds-agent
    endpoint: POST /acme/refunds
    args: { order_id: A-6302, customer_id: cus_7120, amount: 9000, destination: vikram.n@oksbi }
    world:
      orders: { A-6302: { id: A-6302, customer_id: cus_7120, total: 900, status: paid } }
      customers: { cus_7120: { id: cus_7120, name: Vikram N. } }
      destinations: { vikram.n@oksbi: { id: vikram.n@oksbi, customer_id: cus_7120, age_hours: 2400 } }

  - id: text_mismatch
    class: refund
    flag: mismatch
    explain: the agent's text and the call disagreed on the amount
    caught: the agent's text disagreeing with the call
    agent: refunds-agent
    endpoint: POST /acme/refunds
    said: Refunding ₹2,400 for order A-8120.
    args: { order_id: A-8120, customer_id: cus_3355, amount: 24000, destination: farah.k@okhdfc }
    world:
      orders: { A-8120: { id: A-8120, customer_id: cus_3355, total: 24000, status: paid } }
      customers: { cus_3355: { id: cus_3355, name: Farah K. } }
      destinations: { farah.k@okhdfc: { id: farah.k@okhdfc, customer_id: cus_3355, age_hours: 1100 } }

  - id: failing_checks
    class: deploy
    flag: failing_checks
    explain: a prod deploy with failing checks, late on a Friday
    caught: the failing checks
    agent: ops-agent
    endpoint: POST /acme/deploys
    args: { service: checkout, env: prod, version: v2.15.0-rc1 }
    world:
      ci: { v2.15.0-rc1: { version: v2.15.0-rc1, status: failing, failing: [checkout-e2e, tax-rounding] } }
      services: { checkout: { name: checkout, live_version: v2.13.2, owner: alex } }

  - id: bulk_export
    class: customer_email
    flag: bulk_data
    explain: an attachment of 3,000 customer rows going to an external domain
    caught: the customer list going outside the company
    agent: support-agent
    endpoint: POST /acme/emails
    args: { to: reports@ledgerly-audit.example, subject: Quarterly customer export, body: Attached as requested., attachments: [customer-export.csv] }
    world:
      files: { customer-export.csv: { name: customer-export.csv, rows: 3000, bytes: 180000, synthetic: true } }

  - id: delete_no_backup
    class: delete
    flag: no_backup
    explain: a delete with no backup of that table
    caught: the delete with no backup
    agent: coder
    endpoint: DELETE /acme/records/customers/cus_9021
    args: {}
    extra_flags:
      - { code: no_backup, text: No backup of this table in the last 30 days }

  - id: merge_disables_auth
    class: merge
    flag: touches_auth
    explain: a merge whose diff disables an auth check
    caught: the diff disabling an auth check
    agent: coder
    endpoint: POST /github/merge
    args: { repo: acme-mini-app, pr: 318 }
    world:
      github: { "318": { number: 318, repo: acme-mini-app, author: coder, changes: 14, files: [auth/session-guard.ts], checks: passing } }
