version: 1
mode: enforce            # enforce | shadow
currency: INR
time_scale: 1            # the demo sets CLEARANCE_TIME_SCALE=10

tiers:                   # score thresholds; the score comes from the risk rules below
  low:      [0, 30]
  medium:   [30, 55]
  high:     [55, 80]
  critical: [80, 101]

defaults:
  request_ttl: 25m
  grant_ttl: 10m
  max_open_cards_per_person: 6
  exclude_requester: true
  exclude_agent_owner_from: high      # tier at or above which the agent's owner cannot approve
  unknown_protected_action: hold
  business_hours: { days: Mon-Fri, hours: "09:00-19:00", tz: Asia/Kolkata }
  fallback: { group: eng-leads, room: "#approvals" }   # nobody eligible: card goes here, and the room is told why
  gate_mcp_servers: [clearance_gate]                   # MCP servers that are the gate itself
  known_mcp_servers: [clearance_gate, switch, builtin] # any other MCP server is denied; builtin is the adapters' name for a vendor's own tools

safe:                    # pass silently, no card ("quiet on safe work")
  - { shell: '^(ls|cat|grep|rg|git (status|diff|log|show)|pnpm (test|lint|typecheck))\b' }
  - { file_write: '^(src|tests|docs)/' }
  - { file_read: '.' }
  - { gate: 'GET /acme/*' }
  - { mcp: 'check_clearance' }
  - { mcp: 'switch/*' }  # Switch's own chat tools; update_agent_detail is denied below, and deny comes first
  - { mcp: '^builtin/(Task|Agent|TodoWrite|TodoRead|ToolSearch|AskUserQuestion|ExitPlanMode|WebSearch|Skill|SlashCommand|BashOutput|KillShell|KillBash|task|todowrite|todoread|question|skill|websearch)$' }

protected:               # no class matched and one of these did: PLAN 7.3 step 6. Gate writes are always protected.
  - { mcp: '*' }
  - { http: '^(POST|PUT|PATCH|DELETE)\s' }
  - { shell: '^(\S*/)?(curl|wget)\b(?!.*(localhost|127\.0\.0\.1):7710)' }  # the gate on :7710 holds what it needs to
  - { shell: '^(\S*/)?(ssh|scp|rsync|nc|ncat|sudo|psql|mysql|redis-cli|aws|gcloud|az|helm|npm\s+publish)\b' }
  - { file_write: '(^|/)(secrets|\.github|\.git|infra|migrations)/' }
  - { file_write: '^(/|~|\.\./)' }

classes:
  refund:
    summary: refunds
    match:
      - { gate: 'POST /acme/refunds' }
      - { mcp: 'refund_customer', via_gate: true }
      - { shell: '^(\./)?(bin/)?acme\s+refund\b', via_gate: true }
      - { shell: '(^|/)acme\s+refund\b' }
    extract:
      amount: 'args.amount'
      customer: 'args.customer_id'
      customer_name: 'lookup("customers", args.customer_id).name'
      destination: 'args.destination'
      order: 'args.order_id'
      order_total: 'lookup("orders", args.order_id).total'
      destination_age_hours: 'lookup("destinations", args.destination).age_hours'
    risk:
      base: 20
      add:
        - { when: 'amount > 10000', points: 35, why: 'refunds over ₹10,000' }
        - { when: 'amount > 100000', points: 40 }   # very large refunds reach critical
        - { when: 'amount > 3 * order_total', points: 8, flag: amount_vs_order }    # a flag shows whatever its points
        - { when: 'destination_age_hours < 24', points: 8, flag: new_destination }
        - { when: 'outside_hours()', points: 5, flag: outside_hours }
    aggregate:                         # anti-structuring: ten small refunds do not slip under the threshold
      - { sum: amount, by: customer, window: 24h, over: 10000, then: hold, why: 'refunds to one customer over ₹10,000 in 24 h' }
    reversible: false
    approvers:
      label: finance
      any_of: [ { role: finance-approver }, { group: finance } ]
      quorum: { default: 1, critical: 2 }
    escalate:
      - { after: 3m,  add: backup }
      - { after: 8m,  post: '#approvals', mention: '@finance-approvers' }
      - { after: 20m, notify: requester }
    autonomy:
      max_level: L3
      buckets: [ { name: small, when: 'amount <= 5000' } ]
      promote_after: { approvals: 20, days: 7, min_distinct_approvers: 2 }
    drills: true

  deploy:
    summary: deploys
    match:
      - { gate: 'POST /acme/deploys' }
      - { mcp: 'deploy_service', via_gate: true }
      - { shell: '^(\./)?(bin/)?acme\s+deploy\b', via_gate: true }
      - { shell: '(^|/)(acme\s+deploy|kubectl\s+(apply|rollout)|terraform\s+apply)\b' }
    extract:
      service: 'args.service'
      env: 'args.env'
      version: 'args.version'
      checks: 'lookup("ci", args.version).status'
      live_version: 'lookup("services", args.service).live_version'
    risk:
      base: 25
      add:
        - { when: 'env == "prod"', points: 35, why: 'prod deploys' }
        - { when: 'checks != "passing"', points: 30, flag: failing_checks }
        - { when: 'friday_after("18:00")', points: 10 }
    reversible: true                   # a rollback exists
    approvers:
      label: eng
      any_of: [ { owner_of: service }, { role: eng-oncall } ]
      exclude_agent_owner_from: never  # SC6: Alex owns ops-agent and the service; someone else asked, so Alex decides
      quorum: { default: 1 }
    escalate:
      - { after: 5m,  add: backup }
      - { after: 10m, post: '#eng' }
    autonomy:
      max_level: L2
      buckets: [ { name: staging, when: 'env == "staging"' } ]
    drills: true

  merge:
    summary: merges to main
    match:
      - { gate: 'POST /github/merge' }
      - { mcp: 'merge_pull_request', via_gate: true }
      - { shell: '(^|/)git\s+push\b.*\b(main|master)\b' }
      - { shell: '(^|/)git\s+push\s+.*--force' }
      - { shell: '(^|/)git\s+push(\s+-\S+)*(\s+[^\s-]\S*)?\s*$' }   # no branch named: it may well be main
      - { shell: '(^|/)git\s+push\b.*(\bHEAD\b|\$)' }                          # a branch only known at run time
    extract:
      repo: 'args.repo'
      pr: 'args.pr'
      author: 'lookup("github", args.pr).author'
      diff_lines: 'lookup("github", args.pr).changes'
    risk:
      base: 30
      add:
        - { when: 'diff_lines > 400', points: 20 }
        - { when: 'touches("auth/**")', points: 25, flag: touches_auth }
    reversible: true
    approvers:
      label: eng
      any_of: [ { group: eng } ]
      exclude: [ author ]
      quorum: { default: 1, critical: 2 }
    autonomy: { max_level: L1 }

  customer_email:
    summary: customer emails
    match:
      - { gate: 'POST /acme/emails' }
      - { mcp: 'send_customer_email', via_gate: true }
      - { shell: '^(\./)?(bin/)?acme\s+email\b', via_gate: true }
      - { shell: '(^|/)acme\s+email\b' }
    extract:
      to: 'args.to'
      subject: 'args.subject'
      domain: 'domain(args.to)'
      rows: 'count_rows(args.attachments)'
      attachments: 'len(args.attachments)'
    risk:
      base: 15
      add:
        - { when: 'rows > 100', points: 50, flag: bulk_data, why: 'customer emails with bulk data' }
        - { when: 'not (domain in ["acme.in"])', points: 15 }
    reversible: false
    approvers:
      label: support-lead
      any_of: [ { role: support-lead } ]
      exclude_agent_owner_from: never  # SC5: Priya owns support-agent and leads support; Sam asked, so Priya decides
    autonomy:
      max_level: L3
      buckets: [ { name: plain_reply, when: 'attachments == 0' } ]
    drills: true

  delete:
    summary: deletes
    match:
      - { gate: 'DELETE /acme/records/*' }
      - { mcp: 'delete_records', via_gate: true }
      - { shell: '(^|/)rm\s+(-\S+\s+)*(/|~|\.\.)' }
      - { shell: '\bDROP\s+TABLE\b' }
    risk: { base: 70 }
    reversible: false
    approvers:
      label: eng
      any_of: [ { group: eng } ]
      quorum: { default: 2 }
    autonomy: { max_level: L0 }

  protected_config:                    # anti-evasion (F14): never routed, always denied with a reason
    match:
      - { file_write: '(^|/)\.(claude|codex|opencode|cursor)/' }
      - { file_write: 'clearance.*\.ya?ml$' }
      - { file_write: '(^|/)\.env' }
      - { file_read: '(^|/)\.env' }
      - { file_read: '(^|/)secrets/' }
      - { shell: '(^|/)docker(\s|$)' }
      - { shell: '(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]):7800' }
      - { shell: '(^|[\s/"''=<])\.env(\b|\.)' }
      - { shell: '(^|[\s/"''])secrets/' }
      - { shell: '(^|[\s/"''=>])\.(claude|codex|opencode|cursor)/' }
      - { shell: 'clearance[^\s]*\.ya?ml' }
      - { http: '(localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]):7800' }
      - { mcp: 'update_agent_detail' }
      - { mcp: '^mcp__claude_ai_' }                    # the operator's claude.ai connectors leak into managed agents
    decision: deny

drills:
  enabled: true
  rate: 0.05
  max_per_person_per_day: 1
  library: drills/flaws.yaml

rubber_stamp:
  t_min: { base_s: 2, per_evidence_line_s: 0.25, tier_bonus_s: { high: 3, critical: 6 } }
  streak: { approvals: 5, max_denials: 0 }
  friction: type_to_confirm

policy_owners: [ { role: finance-approver }, { group: eng-leads } ]
policy_change_quorum: 2
break_glass: { people: [alex], review_within: 24h }
