# The demo video, built from the table in PLAN section 12. `pnpm video:build` reads this.
#
# Voice-over is read as written. `{{E1.clearance}}` pulls a cell from RESULTS.md at build time, and
# `[[if E2/risky.clearance]]...[[/if]]` is only said once that cell has a number. Nothing that has no number yet is said
# or shown: a voice-over that would read "pending" fails the build, and the slide only shows rows with a result.
# Never type a result here: a number that isn't from RESULTS.md or listed under `cited` fails the build.
#
# Clips are relative to docs/media/raw/ and come from `pnpm demo:run <SC> --record`. Pin a good take by
# replacing `latest` with its number. `segments` keeps parts of a clip, in seconds or by scenario step name.

max_duration_s: 180

default_notices:
  - "persona actions are scripted; agents' words are not"

# Every number that isn't one of our results, and where it comes from.
cited:
  - { value: "93%", source: "Anthropic, Claude Code auto mode, Mar 2026. Its notice is on sc14" }
  - { value: "Mar 2026", source: "the date of that Anthropic figure" }
  - { value: "₹40,000", source: "seeded order A-2004, synthetic: packages/acme" }
  - { value: "of 25", source: "the size of E1's suite, PLAN 10.2" }
  - { value: "Two humans", source: "policy: a promotion takes two signatures" }
  - { value: "7-day", source: "the synthetic history's length, scripts/seed-history.ts" }
  - { value: "per hundred", source: "E6's unit, PLAN 10.7" }
  - {
      value: "10x",
      source: "drills/flaws.yaml: the amount_10x drill, whose flaw is planted",
      only_in: [sc9],
    }

# A judge skims. The build fails if Clearance's refusal of Priya isn't on screen by this time. `scene` ends on the
# refusal, so where that scene ends is the latest it can appear. `seen` is the recorder's own record of the moment its
# text is visible in Priya's page, and the build fails on a take with no such record, or if it maps past the limit.
first_refusal: { scene: sc3-refused, within_s: 20, seen: "Clearance's refusal of Priya" }

scenes:
  - id: sc2
    kind: clip
    planned_s: 8
    # "Refunded" has to stay up to be read, and this scene can't grow without moving the refusal. So: the agent's start-up
    # is cut, the rest runs at the 6x limit, and the last frame holds. Pinned because these seconds are this take's.
    source:
      clip: takes/SC2/6/priya.mp4
      speed: 6
      segments:
        - { from: "Priya asks refunds-agent-vanilla for the refund in #support-vanilla", to: 4.5 }
        - { from: 11.3, to: 42.3 }
    voiceover: "This is Switch today. Priya asks an agent for a ₹40,000 refund, and Priya approves every card."

  - id: sc3-refused
    kind: split
    planned_s: 12
    sources:
      - clip: takes/SC3/latest/priya.mp4
        segments:
          - {
              from: "Priya asks refunds-agent to handle ticket T-77 in #support",
              to: "Acme: Priya's approval moved no money",
            }
      - clip: takes/SC3/latest/sam.mp4
        segments:
          - {
              from: "Priya asks refunds-agent to handle ticket T-77 in #support",
              to: "Acme: Priya's approval moved no money",
            }
    # No recorded run attempted the amount the ticket asks for (`pnpm eval:baseline`), and the take's own step says whether this one did.
    callouts:
      - "The agent caught the wrong amount in this ticket"
      - "Clearance: the approval layer, built on Switch"
    voiceover: "The agent caught the wrong amount in this ticket and asked which payment ID was right. Priya, scripted, picks the new one. Clearance holds it, and refuses Priya's own approval."

  - id: sc3-sam
    kind: split
    planned_s: 14
    sources:
      - clip: takes/SC3/latest/priya.mp4
        segments:
          - {
              from: "Clearance refuses Priya, says why, and says Sam has it",
              to: "Acme: no money moved at all",
            }
      - clip: takes/SC3/latest/sam.mp4
        segments:
          - {
              from: "Clearance refuses Priya, says why, and says Sam has it",
              to: "Acme: no money moved at all",
            }
    voiceover: "It goes to Sam in finance. Sam sees the real call, not the agent's story: a payment ID added minutes ago. Sam denies it."

  - id: sc5-sc6
    kind: split
    planned_s: 20
    sources:
      - { clip: takes/SC5/latest/priya.mp4 }
      - { clip: takes/SC6/latest/alex.mp4 }
    voiceover: "Clearance covers every room and every agent vendor, with no changes to Switch. One policy file: a Codex agent's customer export and an OpenCode agent's production deploy are held the same way, even though OpenCode's auto mode would have asked no one."
    # SC5 needs Codex, which isn't logged in. Until there's a real take this runs alone and names no Codex, and the split
    # above comes back by itself when there is. Record SC6 with `--layout half` then.
    alone:
      missing: takes/SC5/latest/priya.mp4
      source:
        clip: takes/SC6/latest/alex.mp4
        segments:
          - {
              from: "The card reaches Alex (service owner) and shows 2 failing checks",
              to: "Acme: v2.14.0 did not reach prod",
            }
      callouts: ["An OpenCode agent, under the same policy file"]
      voiceover: "Clearance isn't tied to one agent vendor, and Switch doesn't change. Under the same policy file, an OpenCode agent's production deploy is held, and goes to Alex with the failing checks on the card."

  - id: sc8
    kind: split
    planned_s: 15
    clock10x: true
    sources:
      - { clip: takes/SC8/latest/sam.mp4 }
      - { clip: takes/SC8/latest/neha.mp4 }
    voiceover: "If nobody answers, Clearance escalates on a timer, and every approver has one inbox across rooms."

  # Here rather than in the opening: it sets up the drill that follows, and the refusal comes first.
  - id: sc14
    kind: clip
    planned_s: 9
    # The whole take, sped up and labelled. Measured: each press takes a fraction of a second, so keeping only the presses
    # would leave about a second of footage.
    source: { clip: takes/SC14/latest/sam.mp4 }
    callouts: ["staged illustration, real clicks"]
    notices: ["93%: Anthropic, Claude Code auto mode, Mar 2026"]
    voiceover: "And when people are asked, they approve 93% of what they're shown. Approval gates don't stay meaningful on their own."

  - id: sc9
    kind: clip
    planned_s: 30
    # Only the wait for the agent is cut. The typed card, the "didn't match" line and the result stay up to be read.
    source:
      clip: takes/SC9/latest/sam.mp4
      segments:
        - { from: "Clearance sends Sam a drill refund", to: "A real high-risk request arrives" }
        - {
            from: "Sam's next card asks for a typed detail",
            to: "Acme: one refund went out, the real one",
          }
    # The only place the 10x flag appears: no agent attempted that amount, so it's shown as what it is, a planted flaw.
    # It ends with the drill, so it can't read as being about the real card after it.
    timed_callouts:
      - {
          text: "Sam's first card is a drill: its planted flaw is an amount 10x the order total",
          to: "Sam's next card asks for a typed detail",
        }
      - {
          text: "The next card is real: a ₹40,000 refund on a returned order",
          from: "Sam's next card asks for a typed detail",
        }
    voiceover: "People rubber-stamp. So Clearance runs drills, like phishing tests, and adds friction when approvals get too fast. Sam's next high-risk card asks for a detail from the call, typed out. Get it wrong, and it asks again, for a different field. Only the right answer runs it."

  - id: sc11
    kind: split
    planned_s: 20
    callouts: ["7-day history is synthetic, labelled in the repo"]
    sources:
      - { clip: takes/SC11/latest/sam.mp4 }
      - { clip: takes/SC11/latest/alex.mp4 }
    voiceover: "Agents earn autonomy from a record people signed. Two humans approve the promotion, and one incident takes it away."

  - id: numbers
    kind: numbers
    planned_s: 25
    headline: "Measured, not claimed"
    # A row with no result isn't shown, and the voice-over says the same rows.
    rows: [E1, AUDIT, E2/risky, E2/yes, E3/quiet, E6, NEG]
    voiceover: "Measured, not claimed. [[if E1.clearance]]Bad outcomes prevented, of 25: {{E1.clearance}}. The same cases also ran on real Switch. [[/if]][[if AUDIT.clearance]]Independent reviews found more, and each break is now fixed and checked apart. [[/if]][[if E2/risky.clearance]]Risky actions without an eligible human: {{E2/risky.clearance}}. [[/if]][[if E2/yes.baseline]]When the agent asked and the requester said yes, it went ahead without Clearance: {{E2/yes.baseline}}. With it: {{E2/yes.clearance}}. [[/if]][[if E3/quiet.clearance]]Tool calls with no card: {{E3/quiet.clearance}}. [[/if]][[if E6.clearance]]Human decisions per hundred agent actions: {{E6.clearance}}. [[/if]][[if NEG.text]]And one place we lose: {{NEG.text}}.[[/if]]"

  - id: close
    kind: card
    planned_s: 10
    headline: "One template and a few config files."
    lines:
      - "`templates/clearance.template.yaml`"
      - "`.claude/settings.json`  `.codex/hooks.json`  `.opencode/plugins/clearance.ts`  `.cursor/hooks.json`"
      - "Built on Switch's rooms, identities, approval cards and documents."
      - "{{repo_url}}"
    image: desk/live-ledger.png
    # The link's line and these two words wait for CLEARANCE_REPO_URL, together.
    voiceover: "One template and a few config files. Clearance is built on Switch's rooms, identities, approval cards and documents. [[if repo_url]]Link below.[[/if]]"
