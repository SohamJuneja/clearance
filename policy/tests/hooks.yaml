# The same intents through each vendor's hook, normalised to Action by @clearance/adapters.
# F1: a Claude Bash call, a Codex Bash call, an OpenCode bash call and a Cursor shell call that do
# the same thing land in the same class. Shell calls carry no structured args, so risk rules that
# read them are unknown: points are added and missing_data is flagged.
cases:
  # git push to main, all four vendors
  - { name: claude push to main, vendor: claude, agent: coder, shell: "git push origin main", expect: { decision: hold, class: merge, tier: high, score: 75, flags: [missing_data] } }
  - { name: codex push to main, vendor: codex, agent: coder, shell: "git push origin main", expect: { decision: hold, class: merge, tier: high, score: 75, flags: [missing_data] } }
  - { name: opencode push to main, vendor: opencode, agent: coder, shell: "git push origin main", expect: { decision: hold, class: merge, tier: high, score: 75 } }
  - { name: cursor push to main, vendor: cursor, agent: coder, shell: "git push origin main", expect: { decision: hold, class: merge, tier: high, score: 75 } }
  # force push, all four vendors
  - { name: claude force push, vendor: claude, agent: coder, shell: "git push --force origin feature/x", expect: { decision: hold, class: merge, tier: high } }
  - { name: codex force push, vendor: codex, agent: coder, shell: "git push --force origin main", expect: { decision: hold, class: merge, tier: high } }
  - { name: opencode force push, vendor: opencode, agent: coder, shell: "git push -u origin --force main", expect: { decision: hold, class: merge, tier: high } }
  - { name: cursor force push, vendor: cursor, agent: coder, shell: "git push origin main --force", expect: { decision: hold, class: merge, tier: high } }
  - { name: an ordinary feature push passes, vendor: claude, agent: coder, shell: "git push origin feature/x", expect: { decision: allow, class: null, step: unmatched } }
  # the acme CLI goes through the gate, which holds it: the hook must not open a second card
  - { name: claude acme refund defers to the gate, vendor: claude, shell: "acme refund --order A-1931 --amount 40000", expect: { decision: allow, class: refund, step: via_gate } }
  - { name: codex acme refund defers to the gate, vendor: codex, agent: support-agent, shell: "bin/acme refund --order A-1931 --amount 40000", expect: { decision: allow, class: refund, step: via_gate } }
  - { name: opencode acme deploy defers to the gate, vendor: opencode, agent: ops-agent, shell: "acme deploy checkout v2.14.0 --env prod", expect: { decision: allow, class: deploy, step: via_gate } }
  - { name: cursor acme email defers to the gate, vendor: cursor, agent: reviewer, shell: "./bin/acme email --to a@b.c --attach customers.csv", expect: { decision: allow, class: customer_email, step: via_gate } }
  - { name: a fake acme script is held, vendor: claude, shell: "/tmp/acme refund --amount 5", expect: { decision: hold, class: refund, step: class_hold } }
  - { name: safe prefix does not hide a push, vendor: opencode, agent: coder, shell: "ls && git push origin main", expect: { decision: hold, class: merge } }
  - { name: safe prefix does not hide a delete, vendor: cursor, shell: "git status; rm -rf /", expect: { decision: hold, class: delete, tier: high } }
  # deploy scripts
  - { name: claude kubectl apply, vendor: claude, agent: ops-agent, shell: "kubectl apply -f prod.yaml", expect: { decision: hold, class: deploy, tier: critical, score: 90, flags: [missing_data] } }
  - { name: codex kubectl rollout, vendor: codex, agent: ops-agent, shell: "kubectl rollout restart deploy/checkout", expect: { decision: hold, class: deploy, tier: critical } }
  - { name: opencode terraform apply, vendor: opencode, agent: ops-agent, shell: "terraform apply -auto-approve", expect: { decision: hold, class: deploy, tier: critical } }
  - { name: cursor terraform apply, vendor: cursor, agent: ops-agent, shell: "terraform apply", expect: { decision: hold, class: deploy, tier: critical } }
  # delete
  - { name: claude rm -rf root, vendor: claude, shell: "rm -rf /", expect: { decision: hold, class: delete, tier: high, score: 70, flags: [] } }
  - { name: codex rm -rf home, vendor: codex, shell: "rm -rf ~/work", expect: { decision: hold, class: delete, tier: high } }
  - { name: opencode rm -rf parent, vendor: opencode, shell: "rm -rf ../other", expect: { decision: hold, class: delete, tier: high } }
  - { name: cursor drop table, vendor: cursor, shell: "psql -c 'DROP TABLE customers'", expect: { decision: hold, class: delete, tier: high } }
  - { name: removing a build directory is not a delete, vendor: claude, shell: "rm -rf dist", expect: { decision: allow, class: null } }
  # safe list, every vendor
  - { name: claude ls, vendor: claude, shell: "ls -la", expect: { decision: allow, step: safe, flags: [] } }
  - { name: codex git status, vendor: codex, shell: "git status", expect: { decision: allow, step: safe } }
  - { name: opencode git diff, vendor: opencode, shell: "git diff HEAD~1", expect: { decision: allow, step: safe } }
  - { name: cursor pnpm test, vendor: cursor, shell: "pnpm test", expect: { decision: allow, step: safe } }
  - { name: chained safe commands stay safe, vendor: claude, shell: "git status && pnpm lint", expect: { decision: allow, step: safe } }
  - { name: pipes of safe commands stay safe, vendor: codex, shell: "cat src/a.ts | grep foo", expect: { decision: allow, step: safe } }
  - { name: redirect is not on the safe list, vendor: claude, shell: "cat a > b", expect: { decision: allow, step: unmatched } }
  - { name: command substitution is not on the safe list, vendor: claude, shell: "ls $(rm x)", expect: { decision: allow, step: unmatched } }
  # files
  - { name: claude write in src, vendor: claude, file_write: "src/app.ts", expect: { decision: allow, step: safe } }
  - { name: codex write in tests, vendor: codex, file_write: "tests/app.test.ts", expect: { decision: allow, step: safe } }
  - { name: opencode write in docs, vendor: opencode, file_write: "docs/x.md", expect: { decision: allow, step: safe } }
  - { name: cursor write elsewhere in the repo, vendor: cursor, file_write: "package.json", expect: { decision: allow, step: unmatched } }
  - { name: reading source is safe, vendor: claude, file_read: "src/app.ts", expect: { decision: allow, step: safe } }
  - { name: writing to a workflow is protected, vendor: claude, file_write: ".github/workflows/ci.yml", expect: { decision: hold, class: null, step: unknown_protected, flags: [no_rule] } }
  - { name: climbing out of src is not safe, vendor: codex, file_write: "src/../../etc/passwd", expect: { decision: hold, class: null, step: unknown_protected } }
  - { name: writing an absolute path outside the repo is protected, vendor: claude, file_write: "/etc/hosts", expect: { decision: hold, class: null, step: unknown_protected } }
  - { name: writing under secrets is protected, vendor: opencode, file_write: "config/secrets/key.pem", expect: { decision: hold, step: unknown_protected } }
  # MCP tools
  - { name: gate MCP refund defers to the gate, vendor: claude, mcp: { server: clearance_gate, tool: refund_customer, args: { amount: 40000 } }, expect: { decision: allow, class: refund, step: via_gate } }
  - { name: prefixed gate MCP tool name still matches, vendor: claude, mcp: { server: clearance_gate, tool: mcp__clearance_gate__send_customer_email, args: { to: a@b.c } }, expect: { decision: allow, class: customer_email, step: via_gate } }
  - { name: check_clearance is safe, vendor: cursor, mcp: { server: clearance_gate, tool: check_clearance, args: { request_id: CLR-0001 } }, expect: { decision: allow, step: safe } }
  - { name: Switch chat tools are safe, vendor: claude, mcp: { server: switch, tool: post_message, args: { body: hi } }, expect: { decision: allow, step: safe } }
  # http tools
  - { name: fetching public docs passes, vendor: claude, http: { method: GET, url: "https://docs.example.com/x" }, expect: { decision: allow, step: unmatched } }
  - { name: posting anywhere is protected, vendor: claude, http: { method: POST, url: "https://paste.example/upload", body: x }, expect: { decision: hold, class: null, step: unknown_protected } }
  # malformed
  - { name: shell action with no command fails closed, vendor: claude, malformed: shell, expect: { decision: hold, class: null, step: malformed } }
  - { name: mcp action with no call fails closed, vendor: codex, malformed: mcp, expect: { decision: hold, class: null, step: malformed } }
  - { name: gate action with no endpoint fails closed, vendor: gate, malformed: business, expect: { decision: hold, class: null, step: malformed } }
